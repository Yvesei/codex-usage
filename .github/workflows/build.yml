name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must have the form v1.2.3' >&2
            exit 1
          fi
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Run tests
        run: bash scripts/test.sh

      - name: Build universal app
        run: BUILD_UNIVERSAL=1 bash scripts/build.sh

      - name: Verify app
        run: |
          xcrun lipo 'build/Codex Usage.app/Contents/MacOS/CodexUsage' -verify_arch x86_64 arm64
          codesign --verify --strict --verbose 'build/Codex Usage.app'

      - name: Create disk image
        run: |
          bash scripts/create-dmg.sh
          cd build
          shasum -a 256 Codex-Usage.dmg > Codex-Usage.dmg.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Usage
          path: |
            build/Codex-Usage.dmg
            build/Codex-Usage.dmg.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Codex-Usage
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/Codex-Usage.dmg dist/Codex-Usage.dmg.sha256 --verify-tag --generate-notes
